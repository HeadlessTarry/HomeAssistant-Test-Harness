---
name: Reproduce Issue 174

on:
  workflow_dispatch:
    inputs:
      runs:
        description: 'Number of test runs'
        required: true
        default: '50'
        type: string
      test_harness_ref:
        description: 'Test harness branch/ref to test'
        required: true
        default: 'fix/174-stabilization'
        type: string

jobs:
  baseline:
    name: Baseline (v1.15.2 without fix)
    runs-on: ubuntu-latest
    steps:
      - name: ⤵️ Checkout minimal repro
        uses: actions/checkout@v4
        with:
          repository: HeadlessTarry/HomeAssistant
          ref: diagnose/325-ha-unresponsive
          path: ha-repro

      - name: 📋 Copy minimal repro tests
        run: |
          cp -r ha-repro/minimal_repro/* .
          rm -rf ha-repro

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: 📦 Install uv
        uses: astral-sh/setup-uv@v3

      - name: 🔧 Install dependencies (baseline v1.15.2)
        run: |
          # Use the released v1.15.2 (without our fix)
          sed -i 's|ha-integration-test-harness @ git+.*|ha-integration-test-harness @ git+https://github.com/HeadlessTarry/HomeAssistant-Test-Harness.git@v1.15.2|' pyproject.toml
          uv sync --all-extras

      - name: 🧪 Run tests ${{ inputs.runs }}x (baseline)
        run: |
          mkdir -p logs
          passed=0
          failed=0
          for i in $(seq 1 ${{ inputs.runs }}); do
            echo "=== Run $i/${{ inputs.runs }} ==="
            if uv run pytest tests/ --no-cov -v > logs/baseline_$i.log 2>&1; then
              echo "Run $i: PASSED"
              ((passed++))
            else
              echo "Run $i: FAILED"
              ((failed++))
            fi
          done
          echo "## Baseline Results" >> $GITHUB_STEP_SUMMARY
          echo "- Passed: $passed" >> $GITHUB_STEP_SUMMARY
          echo "- Failed: $failed" >> $GITHUB_STEP_SUMMARY
          echo "- Failure rate: $(echo "scale=1; $failed * 100 / ${{ inputs.runs }}" | bc)%" >> $GITHUB_STEP_SUMMARY

      - name: 📤 Upload baseline logs
        uses: actions/upload-artifact@v4
        with:
          name: baseline-logs
          path: logs/

  with-fix:
    name: With fix (fix/174-stabilization)
    runs-on: ubuntu-latest
    steps:
      - name: ⤵️ Checkout minimal repro
        uses: actions/checkout@v4
        with:
          repository: HeadlessTarry/HomeAssistant
          ref: diagnose/325-ha-unresponsive
          path: ha-repro

      - name: 📋 Copy minimal repro tests
        run: |
          cp -r ha-repro/minimal_repro/* .
          rm -rf ha-repro

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: 📦 Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install dependencies (with fix)
        run: |
          # Use our fix branch
          sed -i 's|ha-integration-test-harness @ git+.*|ha-integration-test-harness @ git+https://github.com/HeadlessTarry/HomeAssistant-Test-Harness.git@${{ inputs.test_harness_ref }}|' pyproject.toml
          uv sync --all-extras

      - name: 🧪 Run tests ${{ inputs.runs }}x (with fix)
        run: |
          mkdir -p logs
          passed=0
          failed=0
          for i in $(seq 1 ${{ inputs.runs }}); do
            echo "=== Run $i/${{ inputs.runs }} ==="
            if uv run pytest tests/ --no-cov -v > logs/fix_$i.log 2>&1; then
              echo "Run $i: PASSED"
              ((passed++))
            else
              echo "Run $i: FAILED"
              ((failed++))
            fi
          done
          echo "## With Fix Results" >> $GITHUB_STEP_SUMMARY
          echo "- Passed: $passed" >> $GITHUB_STEP_SUMMARY
          echo "- Failed: $failed" >> $GITHUB_STEP_SUMMARY
          echo "- Failure rate: $(echo "scale=1; $failed * 100 / ${{ inputs.runs }}" | bc)%" >> $GITHUB_STEP_SUMMARY

      - name: 📤 Upload fix logs
        uses: actions/upload-artifact@v4
        with:
          name: fix-logs
          path: logs/

  summary:
    name: Summary
    runs-on: ubuntu-latest
    needs: [baseline, with-fix]
    steps:
      - name: ⤵️ Download baseline logs
        uses: actions/download-artifact@v4
        with:
          name: baseline-logs
          path: baseline/

      - name: ⤵️ Download fix logs
        uses: actions/download-artifact@v4
        with:
          name: fix-logs
          path: fix/

      - name: 📊 Generate summary
        run: |
          baseline_passed=$(grep -l "passed" baseline/*.log 2>/dev/null | wc -l || echo 0)
          baseline_failed=$(grep -l "FAILED" baseline/*.log 2>/dev/null | wc -l || echo 0)
          fix_passed=$(grep -l "passed" fix/*.log 2>/dev/null | wc -l || echo 0)
          fix_failed=$(grep -l "FAILED" fix/*.log 2>/dev/null | wc -l || echo 0)

          echo "## Issue 174 Reproduction Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Configuration | Runs | Passed | Failed | Pass Rate |" >> $GITHUB_STEP_SUMMARY
          echo "|---------------|------|--------|--------|-----------|" >> $GITHUB_STEP_SUMMARY
          echo "| Baseline (v1.15.2) | ${{ inputs.runs }} | $baseline_passed | $baseline_failed | $(echo "scale=1; $baseline_passed * 100 / ${{ inputs.runs }}" | bc)% |" >> $GITHUB_STEP_SUMMARY
          echo "| With fix | ${{ inputs.runs }} | $fix_passed | $fix_failed | $(echo "scale=1; $fix_passed * 100 / ${{ inputs.runs }}" | bc)% |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ $baseline_failed -gt 0 ] && [ $fix_failed -eq 0 ]; then
            echo "Fix is effective: Reduced failures from $baseline_failed to 0" >> $GITHUB_STEP_SUMMARY
          elif [ $baseline_failed -eq 0 ]; then
            echo "Issue not reproduced: Baseline had 0 failures (issue may be environment-specific)" >> $GITHUB_STEP_SUMMARY
          else
            echo "Fix ineffective: Both configurations had failures" >> $GITHUB_STEP_SUMMARY
          fi
