---
# The reference events workflow for a target repository (ADR 0004). Copy it to .github/workflows/factory_events.yml in the target repository;
# it does nothing here (this repository's own copy is .github/workflows/factory_events.yml). It forwards each event to the Factory Router in HeadlessTarry/ForbiddenWorkshop and stays thin: no logic, no factory
# knowledge and no Port credentials. The router trusts nothing it forwards and gathers its own evidence: for an added label, it reads from
# GitHub which labels the issue carries and who added them, and for any other event it finds the Work Item from the issue, pull request or commit forwarded. See
# docs/runbooks/factory-lines.md.
name: Factory Events

# yamllint disable-line rule:truthy
on:
  issues:
    types: [labeled]
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, closed]
  pull_request_review:
    types: [submitted, dismissed]
  workflow_run:
    workflows: ['*']
    types: [completed]

permissions: {}

jobs:
  forward:
    name: 📡 Forward the event to the factory router
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: 🔑 Authenticate as the factory dispatch App
        id: dispatcher
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.FACTORY_DISPATCH_CLIENT_ID }}
          private-key: ${{ secrets.FACTORY_DISPATCH_PRIVATE_KEY }}
          owner: HeadlessTarry
          repositories: ForbiddenWorkshop
          permission-actions: write
      - name: 🔀 Dispatch the factory router
        # The event's values reach the command only as quoted environment variable expansions, so none is ever parsed as shell. --ref
        # names the router's branch, as without it gh first reads the default branch, which a token holding only actions: write may not.
        env:
          GH_TOKEN: ${{ steps.dispatcher.outputs.token }}
          REPOSITORY: ${{ github.repository }}
          EVENT: ${{ github.event_name }}.${{ github.event.action }}
          PULL_REQUEST: ${{ github.event.pull_request.number || github.event.workflow_run.pull_requests[0].number }}
          ISSUE: ${{ github.event.issue.number }}
          COMMIT: ${{ github.event.workflow_run.head_sha }}
        run: |-
          gh workflow run factory_router.yml --repo HeadlessTarry/ForbiddenWorkshop --ref main \
            -f repository="$REPOSITORY" -f event="$EVENT" -f pull_request="$PULL_REQUEST" -f issue="$ISSUE" -f commit="$COMMIT"
