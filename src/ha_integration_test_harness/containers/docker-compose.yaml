---
services:
  homeassistant:
    image: ${HA_IMAGE:-homeassistant/home-assistant:stable}
    # No fixed container name - allows parallel instances
    ports:
      - "8123"  # Ephemeral port mapping - Docker assigns random host port
    volumes:
      - ./homeassistant/generate_long_lived_token.sh:/generate_long_lived_token.sh:ro
      - ./homeassistant/entrypoint.sh:/entrypoint.sh:ro
      - ./homeassistant/hass_wrapper.py:/hass_wrapper.py:ro
      # Mount entire Home Assistant configuration directory as /config
      # HA_CONFIG_ROOT is set by DockerComposeManager to the detected Home Assistant root
      - ${HA_CONFIG_ROOT}:/config
      # Shared data volume (project-scoped for parallel test runs)
      - shared_data:/shared_data:rw
    entrypoint: ["/bin/bash", "/entrypoint.sh"]
    healthcheck:
      start_period: 5s
      test: ["CMD", "sh", "-c", "test -f /shared_data/.homeassistant_ready && curl -sf --max-time 2 http://localhost:8123/ > /dev/null"]
      timeout: 2s
      retries: 30
      interval: 3s

volumes:
  # Project-scoped volume - each parallel test run gets its own isolated shared_data
  shared_data:
