[project]
name = "issue-174-repro"
version = "0.1.0"
description = "Reproduction of HA asyncio event loop blockage (issue #174) - using v1.15.2 (pre-fix commit d0c86a8)"
requires-python = ">=3.14.5"

[build-system]
requires = ["setuptools>=83.0.0"]
build-backend = "setuptools.build_meta"

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "tzdata",
    "ha-integration-test-harness @ git+https://github.com/HeadlessTarry/HomeAssistant-Test-Harness.git@d0c86a8"
]

[tool.setuptools.packages.find]
exclude = ["home_assistant*", "tests*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
addopts = [
    "--strict-markers",
    "--tb=short",
    "-rfE",
]
