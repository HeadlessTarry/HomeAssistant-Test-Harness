---
# Persistent Home Assistant Entities
# These entities are registered during test session startup and
# remain available throughout all tests.
#
# Define entities here that are created by integrations in your real HA setup
# but are not managed through configuration.yaml.

input_boolean:
  guest_mode:
    name: Guest Mode
    initial: false
    icon: mdi:account-group
  # Backing state helpers for the pseudo template entities defined below.
  # In this test harness pattern, these helpers provide the persistent state that
  # the template entities' value_template reads, and turn_on/turn_off are wired to
  # update the helper so that the template reflects the change. Real template
  # entities that derive state from other integrations/entities do not necessarily
  # need a dedicated helper like this.
  state_study_light:
    name: "[State] Study Light"
    initial: false
  state_living_room_lamp:
    name: "[State] Living Room Lamp"
    initial: false
  state_garage_door:
    name: "[State] Garage Door"
    initial: false
  state_template_sensor_source:
    name: "[State] Template Sensor Source"
    initial: false

input_number:
  target_temperature:
    name: Target Temperature
    initial: 20
    min: 10
    max: 30
    step: 0.5
    unit_of_measurement: "°C"
    icon: mdi:thermometer

input_text:
  alarm_code:
    name: Alarm Code
    initial: "1234"
    max: 10
  ai_greeting_result:
    name: AI Greeting Result
    initial: ""
    max: 255

input_select:
  house_mode:
    name: House Mode
    initial: Home
    options:
      - Home
      - Away
      - Night
    icon: mdi:home

timer:
  kitchen_timer:
    name: Kitchen Timer

counter:
  doorbell_presses:
    name: Doorbell Presses
    initial: 0
    step: 1
    icon: mdi:bell

input_button:
  label_automation_trigger:
    name: Label Automation Trigger
    icon: mdi:label
  area_automation_trigger:
    name: Area Automation Trigger
    icon: mdi:home-map-marker

template:
  - light:
      - name: "Living Room Lamp"
        unique_id: "living_room_lamp"
        state: "{{ is_state('input_boolean.state_living_room_lamp', 'on') }}"
        turn_on:
          - action: input_boolean.turn_on
            target:
              entity_id: input_boolean.state_living_room_lamp
        turn_off:
          - action: input_boolean.turn_off
            target:
              entity_id: input_boolean.state_living_room_lamp
      - name: "Study Light"
        unique_id: "study_light"
        state: "{{ is_state('input_boolean.state_study_light', 'on') }}"
        turn_on:
          - action: input_boolean.turn_on
            target:
              entity_id: input_boolean.state_study_light
        turn_off:
          - action: input_boolean.turn_off
            target:
              entity_id: input_boolean.state_study_light
  - switch:
      - name: "Garage Door"
        unique_id: "garage_door"
        state: "{{ is_state('input_boolean.state_garage_door', 'on') }}"
        turn_on:
          - action: input_boolean.turn_on
            target:
              entity_id: input_boolean.state_garage_door
        turn_off:
          - action: input_boolean.turn_off
            target:
              entity_id: input_boolean.state_garage_door
  - sensor:
      - name: "Template Test Sensor"
        unique_id: "template_test_sensor"
        state: "{{ 'on' if is_state('input_boolean.state_template_sensor_source', 'on') else 'off' }}"
