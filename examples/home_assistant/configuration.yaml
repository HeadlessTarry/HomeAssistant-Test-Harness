---
# Minimal Home Assistant configuration for example tests

default_config:

# Enable REST API
api:

# Enable frontend
frontend:

# Enable system health
system_health:

timer:
  # Timer entity which is referenced by example tests
  test_timer:
    duration: '00:00:05'

template:
  - triggers:
      - platform: time_pattern
        # Trigger every second to update the current datetime sensor
        seconds: "*"
    sensor:
      # Sensor to show current datetime for example test assertions
      - name: Current Datetime
        state: "{{ now().replace(microsecond=0).isoformat() }}"

  # Regression cover for issue #178: a state-based template that iterates a whole
  # domain. HA rate limits these, deferring re-renders via a timer, so it exercises
  # whether that deferral is measured on the same clock that recorded it.
  - sensor:
      - name: Clock Coherence Min Trigger
        state: >
          {%- set vals = states.switch
              | selectattr('object_id', 'match', 'clock_coherence_alarm_')
              | map(attribute='attributes.next_trigger')
              | list -%}
          {{ min(vals) if vals else None }}

input_button:
  turn_on_brightness_light:
    name: "Turn on brightness light"
  ai_task_trigger:
    name: "AI task trigger"
  clock_coherence_delay_trigger:
    name: "Clock coherence delay trigger"

automation:
  # Turns on all lights labelled 'test_label_target' when the label automation
  # trigger button is pressed. Used by label-management example tests.
  # Uses label_entities() template function so that the label must exist in the
  # label registry — this is what given_entity_has() ensures before assigning labels.
  - id: example_label_based_turn_on
    alias: "Example - Label Based Turn On"
    trigger:
      - platform: state
        entity_id: input_button.label_automation_trigger
    action:
      - action: light.turn_on
        target:
          entity_id: "{{ label_entities('test_label_target') }}"

  # Turns on all lights in the 'living_room' area when the area automation
  # trigger button is pressed. Used by area-management example tests.
  # Uses area_entities() template function so that the area must exist in the
  # area registry — this is what given_entity_has() ensures before assigning an area.
  - id: example_area_based_turn_on
    alias: "Example - Area Based Turn On"
    trigger:
      - platform: state
        entity_id: input_button.area_automation_trigger
    action:
      - action: light.turn_on
        target:
          entity_id: "{{ area_entities('test_room') }}"

  # Test automation: turns on light with brightness_pct when trigger button is pressed.
  # Used by test_light.py to verify brightness_pct is applied to light entities.
  - id: test_light_brightness_pct
    alias: "Test - Light brightness_pct"
    trigger:
      - platform: state
        entity_id: input_button.turn_on_brightness_light
    action:
      - action: light.turn_on
        data:
          brightness_pct: 10
        target:
          entity_id: light.test_brightness_auto

  # Performance test infrastructure: introduces a 1-second delay whenever one of the
  # reserved 'perf_test' sensor entities changes state.
  #
  # Purpose: discriminate between the buggy path (hass.async_block_till_done()) and
  # the correct path (asyncio.sleep(0)) in ws_create_entity.
  #
  #   Bug  — ws_create_entity awaits async_block_till_done(), which gathers ALL asyncio
  #          tasks including this sleeping automation.  Each entity creation therefore
  #          blocks for ~1 s, making 5 creations take 5 s+.
  #
  #   Fix  — ws_create_entity yields once with asyncio.sleep(0) and returns.  The
  #          automation runs in the background; entity creation takes ~100 ms.
  #
  # The entity IDs listed here are reserved exclusively for test_performance.py.
  - id: perf_test_event_loop_probe
    alias: "Performance test - event loop probe"
    trigger:
      - platform: state
        entity_id:
          - sensor.perf_test_0
          - sensor.perf_test_1
          - sensor.perf_test_2
          - sensor.perf_test_3
          - sensor.perf_test_4
    action:
      - delay: "00:00:01"

  # Regression cover for issue #178: a template trigger comparing an entity's
  # last_changed against now() - 3h. Only behaves correctly if both are on one clock.
  - id: clock_coherence_auto_off
    alias: "Clock coherence - Auto off after 3h"
    mode: single
    triggers:
      - trigger: template
        value_template: >
          {% set threshold = now() - timedelta(hours=3) %}
          {% set ns = namespace(found=false) %}
          {% for eid in label_entities('clock_coherence_auto_off') %}
            {% if states[eid].state == 'on' and states[eid].last_changed <= threshold %}
              {% set ns.found = true %}
            {% endif %}
          {% endfor %}
          {{ ns.found }}
    actions:
      - action: homeassistant.turn_off
        target:
          entity_id: >
            {% set threshold = now() - timedelta(hours=3) %}
            {% set ns = namespace(entities=[]) %}
            {% for eid in label_entities('clock_coherence_auto_off') %}
              {% if states[eid].state == 'on' and states[eid].last_changed <= threshold %}
                {% set ns.entities = ns.entities + [eid] %}
              {% endif %}
            {% endfor %}
            {{ ns.entities }}

  # Regression cover for issue #178: an action that sleeps on a long delay, which
  # must elapse on the fake clock and must not block the time-control response.
  - id: clock_coherence_long_delay
    alias: "Clock coherence - Long delay action"
    mode: single
    triggers:
      - trigger: state
        entity_id: input_button.clock_coherence_delay_trigger
    actions:
      - delay: "00:30:00"
      - action: light.turn_on
        target:
          entity_id: light.clock_coherence_delayed_light

  # Regression cover for issue #178: fires on the timer.finished event, checking
  # that HA timer entities complete when fake time passes their end.
  - id: clock_coherence_timer_finished
    alias: "Clock coherence - Timer finished event"
    mode: single
    triggers:
      - trigger: event
        event_type: timer.finished
        event_data:
          entity_id: timer.test_timer
    actions:
      - action: light.turn_on
        target:
          entity_id: light.clock_coherence_timer_light

  # Regression cover for issue #178: a wall-clock time trigger, which must fire
  # when fake time reaches it.
  - id: clock_coherence_time_trigger
    alias: "Clock coherence - Time trigger"
    mode: single
    triggers:
      - trigger: time
        at: "03:33:00"
    actions:
      - action: light.turn_on
        target:
          entity_id: light.clock_coherence_time_light

  # Test automation: calls ai_task.generate_data and stores the response in a variable,
  # then uses that variable to set a sensor state. Used by test_ai_task.py to verify
  # that ai_task.generate_data works correctly with response_variable in automations.
  - id: test_ai_task_with_response
    alias: "Test - AI task with response variable"
    trigger:
      - platform: state
        entity_id: input_button.ai_task_trigger
    action:
      - action: ai_task.generate_data
        response_variable: ai_response
        data:
          task_name: "Test greeting"
          instructions: "Generate a test greeting"
      - action: input_text.set_value
        target:
          entity_id: input_text.ai_greeting_result
        data:
          value: "{{ ai_response.data }}"
